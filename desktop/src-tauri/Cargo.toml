[package]
name = "dubx-desktop"
version = "0.1.0"
description = "Dubx desktop: calendar blocks that open and close your apps"
edition = "2021"

[lib]
name = "dubx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
# OS credential store: Windows Credential Manager, macOS Keychain, Linux keyutils.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
xcap = "0.9"
sysinfo = "0.37"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Threading",
] }
