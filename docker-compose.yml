services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network Mongo is reachable by service name.
      MONGODB_URI: mongodb://mongo:27017/dubx
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host; only the app can reach it.

volumes:
  mongo-data:
